# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 8

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up Gradle build
      run: ./gradlew SetupCIWorkspace build

    - name: Build with Gradle
      run: ./gradlew cleanBuildAll
      working-directory: publish

    - uses: actions/upload-artifact@v6
      with:
        name: Package
        path: build/libs

    - name: Publish release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=$(python publish/get_version.py | tr -d '\r' | sed 's/^v//')
        DATE=$(date -u +%Y%m%d)
        TAG="v${VERSION}-${DATE}"

        JAR=$(ls build/libs/*.jar | grep -v -e sources -e dev | head -n 1)
        FINAL="recrafted-${TAG}.jar"
        cp "$JAR" "$FINAL"

        gh release create "$TAG" "$FINAL" \
          --target "$GITHUB_SHA" \
          --title "$TAG" \
          --generate-notes
